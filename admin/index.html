<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline';">
<title>教师管理端 — 雅思训练平台</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-dark: #0a0e1a;
    --bg-card: #141828;
    --bg-card2: #1a1f36;
    --purple: #8b5cf6;
    --purple-glow: rgba(139,92,246,0.4);
    --green: #22d3a7;
    --green-glow: rgba(34,211,167,0.3);
    --red: #f43f5e;
    --red-glow: rgba(244,63,94,0.3);
    --gold: #fbbf24;
    --blue: #38bdf8;
    --blue-glow: rgba(56,189,248,0.3);
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-dimmer: #64748b;
    --border: rgba(255,255,255,0.08);
  }
  body {
    font-family: "Segoe UI", "PingFang SC", sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(251,191,36,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.05) 0%, transparent 50%);
    z-index: 0; pointer-events: none;
  }

  /* Header */
  .page-header {
    background: rgba(20,24,40,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 100;
  }
  .logo-badge {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--gold), #f59e0b);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #1a1a1a; font-size: 16px; font-weight: 700; flex-shrink: 0;
  }
  .page-header h1 { font-size: 16px; font-weight: 600; }
  .back-link {
    margin-left: auto; color: var(--text-dim); text-decoration: none;
    font-size: 13px; padding: 6px 14px; border: 1px solid var(--border);
    border-radius: 8px; transition: all 0.2s;
  }
  .back-link:hover { color: var(--text); border-color: var(--gold); }

  /* Tabs */
  .tab-bar {
    display: flex; gap: 0; border-bottom: 1px solid var(--border);
    background: rgba(20,24,40,0.5); padding: 0 24px;
    overflow-x: auto;
  }
  .tab-btn {
    padding: 12px 18px; font-size: 13px; font-weight: 500;
    color: var(--text-dimmer); background: none; border: none;
    border-bottom: 2px solid transparent; cursor: pointer;
    transition: all 0.2s; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text-dim); }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; position: relative; z-index: 1; }

  /* Cards */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 14px; font-weight: 600; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title .icon { font-size: 18px; }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .stat-value {
    font-size: 28px; font-weight: 700; line-height: 1.1;
  }
  .stat-value.green { color: var(--green); }
  .stat-value.gold { color: var(--gold); }
  .stat-value.purple { color: var(--purple); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.red { color: var(--red); }
  .stat-label {
    font-size: 11px; color: var(--text-dimmer); margin-top: 6px;
    text-transform: uppercase; letter-spacing: 1px;
  }

  /* Table */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table th {
    text-align: left;
    padding: 10px 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dimmer);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .data-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    color: var(--text-dim);
  }
  .data-table tr:hover td {
    background: rgba(255,255,255,0.02);
  }

  /* Behavior badge */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.cautious { background: rgba(34,211,167,0.15); color: var(--green); border: 1px solid rgba(34,211,167,0.3); }
  .badge.impulsive { background: rgba(244,63,94,0.15); color: var(--red); border: 1px solid rgba(244,63,94,0.3); }
  .badge.balanced { background: rgba(56,189,248,0.15); color: var(--blue); border: 1px solid rgba(56,189,248,0.3); }

  /* Heatmap bars */
  .heatmap-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .heatmap-row:last-child { border-bottom: none; }
  .heatmap-key {
    width: 200px; font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text);
  }
  .heatmap-bar-wrap {
    flex: 1; height: 22px; background: rgba(255,255,255,0.04);
    border-radius: 4px; overflow: hidden; position: relative;
  }
  .heatmap-bar {
    height: 100%; border-radius: 4px;
    transition: width 0.5s ease;
    position: relative;
  }
  .heatmap-bar.low { background: rgba(34,211,167,0.6); }
  .heatmap-bar.mid { background: rgba(251,191,36,0.7); }
  .heatmap-bar.high { background: rgba(244,63,94,0.7); }
  .heatmap-meta {
    width: 90px; text-align: right; font-size: 12px; color: var(--text-dim);
    flex-shrink: 0;
  }

  /* Chart area */
  .chart-area {
    width: 100%;
    height: 220px;
    position: relative;
  }
  .chart-area canvas {
    width: 100% !important;
    height: 100% !important;
  }

  /* Memory distribution bars */
  .memory-dist-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .memory-dist-row:last-child { border-bottom: none; }
  .memory-dist-label {
    width: 80px; font-size: 13px; font-weight: 500; flex-shrink: 0;
  }
  .memory-dist-bar-wrap {
    flex: 1; height: 26px; background: rgba(255,255,255,0.04);
    border-radius: 6px; overflow: hidden; position: relative;
    display: flex; align-items: center; padding-left: 8px;
  }
  .memory-dist-bar {
    height: 100%; border-radius: 6px; transition: width 0.5s ease;
    display: flex; align-items: center; padding-left: 8px;
    font-size: 11px; font-weight: 600; color: #fff;
    min-width: 0;
  }
  .memory-dist-count {
    width: 50px; text-align: right; font-size: 12px; color: var(--text-dim);
    flex-shrink: 0;
  }

  /* Retention scatter chart */
  .retention-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .retention-item:last-child { border-bottom: none; }
  .retention-item .r-key {
    font-size: 13px; font-weight: 500; color: var(--text);
    flex: 1;
  }
  .retention-item .r-bar-wrap {
    width: 120px; height: 8px; background: rgba(255,255,255,0.06);
    border-radius: 4px; overflow: hidden; flex-shrink: 0;
  }
  .retention-item .r-bar-fill {
    height: 100%; border-radius: 4px;
    transition: width 0.4s ease;
  }
  .retention-item .r-meta {
    width: 80px; font-size: 11px; color: var(--text-dim);
    text-align: right; flex-shrink: 0;
  }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 48px 20px;
    color: var(--text-dimmer); font-size: 14px;
  }
  .empty-state .icon { font-size: 40px; display: block; margin-bottom: 12px; }

  /* Config section */
  .config-section {
    display: flex; gap: 12px; align-items: end; flex-wrap: wrap;
  }
  .config-field {
    display: flex; flex-direction: column; gap: 4px;
  }
  .config-field label {
    font-size: 11px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .config-field input {
    background: var(--bg-card2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; color: var(--text);
    font-size: 13px; width: 240px; outline: none;
  }
  .config-field input:focus { border-color: var(--gold); }
  .config-btn {
    padding: 8px 18px; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; border: none;
    background: linear-gradient(135deg, var(--gold), #f59e0b);
    color: #1a1a1a; transition: transform 0.15s;
  }
  .config-btn:hover { transform: scale(1.03); }
  .config-status {
    font-size: 12px; padding: 8px 0;
  }
  .config-status.ok { color: var(--green); }
  .config-status.err { color: var(--red); }

  /* Student detail modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90%; max-width: 600px;
    max-height: 80vh; overflow-y: auto;
    padding: 24px;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .modal-header h2 { font-size: 18px; font-weight: 600; }
  .modal-close {
    background: none; border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 8px;
    padding: 4px 12px; cursor: pointer; font-size: 13px;
  }
  .modal-close:hover { color: var(--text); border-color: var(--text-dim); }

  /* 密钥管理 */
  .key-stat-card {
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .key-stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .key-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .key-table th {
    text-align: left;
    padding: 10px 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dimmer);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .key-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    color: var(--text-dim);
    font-size: 12px;
  }
  .key-table tr:hover td { background: rgba(255,255,255,0.02); }
  .key-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .key-badge.unused { background: rgba(34,211,167,0.15); color: var(--green); border: 1px solid rgba(34,211,167,0.3); }
  .key-badge.used { background: rgba(100,116,139,0.15); color: var(--text-dim); border: 1px solid rgba(100,116,139,0.2); }
  .key-badge.revoked { background: rgba(244,63,94,0.15); color: var(--red); border: 1px solid rgba(244,63,94,0.3); }
  .key-badge.expired { background: rgba(251,191,36,0.15); color: var(--gold); border: 1px solid rgba(251,191,36,0.3); }
  .copy-btn {
    background: none; border: 1px solid var(--border);
    color: var(--blue); border-radius: 6px;
    padding: 3px 10px; cursor: pointer; font-size: 12px;
    transition: all 0.2s;
  }
  .copy-btn:hover { border-color: var(--blue); background: rgba(56,189,248,0.1); }
  .revoke-btn {
    background: none; border: 1px solid rgba(244,63,94,0.2);
    color: var(--red); border-radius: 6px;
    padding: 3px 10px; cursor: pointer; font-size: 12px;
    transition: all 0.2s;
  }
  .revoke-btn:hover { border-color: var(--red); background: rgba(244,63,94,0.1); }
  .gen-form {
    display: flex; gap: 12px; align-items: end; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .gen-form .config-field { min-width: 0; }
  .gen-form .config-field label { font-size: 11px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
  .gen-form .config-field input, .gen-form .config-field select {
    background: var(--bg-card2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; color: var(--text);
    font-size: 13px; outline: none;
  }
  .gen-form .config-field input:focus, .gen-form .config-field select:focus { border-color: var(--gold); }
  .gen-btn {
    padding: 8px 18px; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; border: none;
    background: linear-gradient(135deg, var(--gold), #f59e0b);
    color: #1a1a1a; transition: transform 0.15s;
  }
  .gen-btn:hover { transform: scale(1.03); }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .export-btn {
    padding: 8px 18px; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; border: 1px solid var(--green);
    background: rgba(34,211,167,0.1);
    color: var(--green); transition: all 0.15s;
    margin-left: 8px;
  }
  .export-btn:hover { background: rgba(34,211,167,0.2); }

  /* Student search/filter bar */
  .filter-bar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .filter-bar input, .filter-bar select {
    background: var(--bg-card2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; color: var(--text);
    font-size: 13px; outline: none;
  }
  .filter-bar input:focus, .filter-bar select:focus { border-color: var(--gold); }
  .filter-bar input { width: 200px; }
  .filter-bar select { min-width: 140px; }

  .pw-btn {
    background: none; border: 1px solid var(--border);
    color: var(--purple); border-radius: 6px;
    padding: 3px 10px; cursor: pointer; font-size: 12px;
    transition: all 0.2s;
  }
  .pw-btn:hover { border-color: var(--purple); background: rgba(139,92,246,0.1); }

  /* Stats report btn */
  .report-btn {
    padding: 8px 18px; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; border: 1px solid var(--blue);
    background: rgba(56,189,248,0.1);
    color: var(--blue); transition: all 0.15s;
  }
  .report-btn:hover { background: rgba(56,189,248,0.2); }

  @media (max-width: 640px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .heatmap-key { width: 120px; font-size: 12px; }
    .config-field input { width: 160px; }
    .filter-bar input { width: 140px; }
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    z-index: 99999;
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success {
    background: rgba(34,211,167,0.15);
    border: 1px solid rgba(34,211,167,0.3);
    color: var(--green);
    backdrop-filter: blur(8px);
  }
  .toast.error {
    background: rgba(244,63,94,0.15);
    border: 1px solid rgba(244,63,94,0.3);
    color: var(--red);
    backdrop-filter: blur(8px);
  }

</style>
</head>
<body>

<div class="page-header">
  <div class="logo-badge">🛠</div>
  <h1>教师管理端</h1>
  <a class="back-link" href="../index.html">← 返回平台</a>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="overview">📊 总览</button>
  <button class="tab-btn" data-tab="students">👥 学生画像</button>
  <button class="tab-btn" data-tab="heatmap">🔥 错题热力图</button>
  <button class="tab-btn" data-tab="memory">🧠 遗忘曲线</button>
  <button class="tab-btn" data-tab="keys">🔑 密钥管理</button>
</div>

<div class="container">

  <!-- Tab: Overview -->
  <div class="tab-panel active" id="tab-overview">
    <div class="stats-row" id="overviewStats">
      <div class="stat-card"><div class="stat-value green" id="ov-totalAnswers">—</div><div class="stat-label">总答题数</div></div>
      <div class="stat-card"><div class="stat-value gold" id="ov-accuracy">—</div><div class="stat-label">平均正确率</div></div>
      <div class="stat-card"><div class="stat-value purple" id="ov-sessions">—</div><div class="stat-label">练习轮次</div></div>
      <div class="stat-card"><div class="stat-value blue" id="ov-avgMs">—</div><div class="stat-label">平均响应</div></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">📈</span> 每日学习趋势（最近7天）</div>
      <div class="chart-area"><canvas id="dailyChart"></canvas></div>
    </div>
  </div>

  <!-- Tab: Students -->
  <div class="tab-panel" id="tab-students">
    <div class="card">
      <div class="card-title">
        <span class="icon">👥</span> 学生行为画像
        <button class="report-btn" style="margin-left:auto;" onclick="exportStudentReport()">📥 导出统计报告</button>
      </div>
      <div class="filter-bar">
        <input type="text" id="studentSearch" placeholder="搜索姓名/用户名..." oninput="renderStudentsTable()">
        <select id="batchFilter" onchange="renderStudentsTable()">
          <option value="">全部批次</option>
        </select>
      </div>
      <div id="studentsTable">
        <div class="empty-state"><span class="icon">📭</span>暂无学生数据<br><small>学生开始练习后数据将自动出现</small></div>
      </div>
    </div>
  </div>

  <!-- Tab: Heatmap -->
  <div class="tab-panel" id="tab-heatmap">
    <div class="card">
      <div class="card-title"><span class="icon">🔥</span> 错题热力图（按词组错误率排序）</div>
      <div id="heatmapContent">
        <div class="empty-state"><span class="icon">📭</span>暂无数据</div>
      </div>
    </div>
  </div>

  <!-- Tab: Memory / Forgetting Curve -->
  <div class="tab-panel" id="tab-memory">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-value purple" id="mem-total">—</div><div class="stat-label">已学词组</div></div>
      <div class="stat-card"><div class="stat-value green" id="mem-mastered">—</div><div class="stat-label">已掌握</div></div>
      <div class="stat-card"><div class="stat-value gold" id="mem-learning">—</div><div class="stat-label">学习中</div></div>
      <div class="stat-card"><div class="stat-value red" id="mem-due">—</div><div class="stat-label">待复习</div></div>
      <div class="stat-card"><div class="stat-value blue" id="mem-retention">—</div><div class="stat-label">平均保持率</div></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">📊</span> 记忆状态分布</div>
      <div id="memoryDistContent">
        <div class="empty-state"><span class="icon">📭</span>暂无记忆数据</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">📉</span> 词组记忆保持率（按保持率升序）</div>
      <div id="retentionList">
        <div class="empty-state"><span class="icon">📭</span>暂无数据</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">📅</span> 7天复习日程预览</div>
      <div id="scheduleContent">
        <div class="empty-state"><span class="icon">📭</span>暂无数据</div>
      </div>
    </div>
  </div>

  <!-- Tab: Keys -->
  <div class="tab-panel" id="tab-keys">
    <div class="key-stats-row" id="keysStats">
      <div class="key-stat-card"><div class="stat-value purple" id="key-total">—</div><div class="stat-label">总数</div></div>
      <div class="key-stat-card"><div class="stat-value green" id="key-unused">—</div><div class="stat-label">未使用</div></div>

  // ── Chart (Canvas, no dependencies) ──
  function drawDailyChart(stats) {
    const canvas = document.getElementById('dailyChart');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = 220 * dpr;
    ctx.scale(dpr, dpr);
    const W = rect.width, H = 220;

    ctx.clearRect(0, 0, W, H);
    if (stats.length === 0) return;

    const padL = 40, padR = 20, padT = 20, padB = 36;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;

    const maxAnswers = Math.max(1, ...stats.map(s => s.answers));

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = padT + (chartH / 4) * i;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    }

    // X labels
    ctx.fillStyle = '#64748b';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    stats.forEach((s, i) => {
      const x = padL + (chartW / (stats.length - 1 || 1)) * i;
      const label = s.date.slice(5);
      ctx.fillText(label, x, H - 8);
    });

    // Y labels
    ctx.textAlign = 'right';
    ctx.fillStyle = '#8b5cf6';
    for (let i = 0; i <= 4; i++) {
      const val = Math.round(maxAnswers * (1 - i/4));
      const y = padT + (chartH / 4) * i + 4;
      ctx.fillText(val, padL - 8, y);
    }

    // Bars
    const barW = Math.min(30, chartW / stats.length * 0.6);
    stats.forEach((s, i) => {
      const x = padL + (chartW / (stats.length - 1 || 1)) * i;
      const correctH = maxAnswers > 0 ? (s.correct / maxAnswers) * chartH : 0;
      const wrongH = maxAnswers > 0 ? (s.wrong / maxAnswers) * chartH : 0;
      const totalH = correctH + wrongH;

      ctx.fillStyle = 'rgba(34,211,167,0.7)';
      ctx.fillRect(x - barW/2, padT + chartH - totalH, barW, correctH);
      ctx.fillStyle = 'rgba(244,63,94,0.6)';
      ctx.fillRect(x - barW/2, padT + chartH - wrongH, barW, wrongH);
    });

    // Line (accuracy)
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.beginPath();
    stats.forEach((s, i) => {
      const x = padL + (chartW / (stats.length - 1 || 1)) * i;
      const y = padT + chartH - (s.accuracy / 100) * chartH;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Dots
    stats.forEach((s, i) => {
      const x = padL + (chartW / (stats.length - 1 || 1)) * i;
      const y = padT + chartH - (s.accuracy / 100) * chartH;
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#fbbf24';
      ctx.fill();
    });

    // Legend
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(34,211,167,0.7)';
    ctx.fillRect(padL, 6, 12, 8);
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('正确', padL + 16, 14);
    ctx.fillStyle = 'rgba(244,63,94,0.6)';
    ctx.fillRect(padL + 56, 6, 12, 8);
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('错误', padL + 72, 14);
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(padL + 112, 6, 12, 8);
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('正确率', padL + 128, 14);
  }

  // ── Heatmap ──
  async function loadHeatmap() {
    const items = await adminTracker.getErrorHeatmap();

    let html = '';
    items.slice(0, 30).forEach(item => {
      const rate = item.error_rate_pct || 0;
      const cls = rate >= 50 ? 'high' : rate >= 25 ? 'mid' : 'low';
      const barWidth = Math.max(rate, 2);
      html += `<div class="heatmap-row">
        <div class="heatmap-key" title="${item.item_key}">${item.item_key}</div>
        <div class="heatmap-bar-wrap">
          <div class="heatmap-bar ${cls}" style="width:${barWidth}%"></div>
        </div>

      </div>`;
    });

    container.innerHTML = html;

  // ── Memory / Forgetting Curve ──
  async function loadMemory() {
    const overview = await adminTracker.getAdminMemoryOverview();
    const allStates = await adminTracker.getAllMemoryStates();
    const schedule = await adminTracker.getReviewSchedule();

    // Stats
    document.getElementById('mem-total').textContent = overview.totalItems || '—';
    document.getElementById('mem-mastered').textContent = overview.mastered || '—';
    document.getElementById('mem-learning').textContent = overview.learning || '—';
    document.getElementById('mem-due').textContent = overview.dueNow || '—';
    document.getElementById('mem-retention').textContent = overview.avgRetention ? overview.avgRetention + '%' : '—';

    // Memory distribution
    const distEl = document.getElementById('memoryDistContent');
    if (overview.totalItems === 0) {
      distEl.innerHTML = '<div class="empty-state"><span class="icon">📭</span>暂无记忆数据<br><small>学生开始练习后记忆状态将自动计算</small></div>';
    } else {
      const maxVal = Math.max(1, overview.mastered, overview.learning, overview.dueNow,
        overview.totalItems - overview.mastered - overview.learning - overview.dueNow);
      const segments = [
        { label: '🟢 已掌握', value: overview.mastered, color: 'rgba(34,211,167,0.7)', count: overview.mastered },
        { label: '🟡 学习中', value: overview.learning, color: 'rgba(251,191,36,0.7)', count: overview.learning },
        { label: '🔴 待复习', value: overview.dueNow, color: 'rgba(244,63,94,0.7)', count: overview.dueNow },
      ];
      const accounted = overview.mastered + overview.learning + overview.dueNow;
      const newItems = overview.totalItems - accounted;
      if (newItems > 0) segments.push({ label: '🟣 新词', value: newItems, color: 'rgba(139,92,246,0.7)', count: newItems });

      let html = '';
      segments.forEach(seg => {
        const pct = overview.totalItems > 0 ? Math.round(seg.count / overview.totalItems * 100) : 0;
        const barPct = Math.max(Math.round(seg.count / maxVal * 100), seg.count > 0 ? 6 : 0);
        html += `<div class="memory-dist-row">
          <div class="memory-dist-label">${seg.label}</div>
          <div class="memory-dist-bar-wrap">
            <div class="memory-dist-bar" style="width:${barPct}%;background:${seg.color};">${seg.count > 0 ? seg.count + ' 个' : ''}</div>
          </div>
          <div class="memory-dist-count">${pct}%</div>
        </div>`;
      });
      distEl.innerHTML = html;
    }

    // Retention list
    const retentionEl = document.getElementById('retentionList');
    if (allStates.length === 0) {
      retentionEl.innerHTML = '<div class="empty-state"><span class="icon">📭</span>暂无记忆保持率数据</div>';
    } else {
      const now = Date.now();
      const sorted = [...allStates].map(s => {
        const daysSince = (now - s.lastReview) / (24 * 60 * 60 * 1000);
        const retention = Math.exp(-daysSince / Math.max(s.stability, 0.5));
        return { ...s, currentRetention: retention };
      }).sort((a, b) => a.currentRetention - b.currentRetention);

      let html = '';
      sorted.slice(0, 30).forEach(item => {
        const retPct = Math.round(item.currentRetention * 100);
        const color = retPct >= 70 ? 'var(--green)' : retPct >= 40 ? 'var(--gold)' : 'var(--red)';
        const nextDate = item.nextReview > 0
          ? new Date(item.nextReview).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' })
          : '—';

        html += `<div class="retention-item">
          <span class="r-key">${item.itemKey}</span>
          <div class="r-bar-wrap">
            <div class="r-bar-fill" style="width:${retPct}%;background:${color};"></div>
          </div>
          <span class="r-meta">${retPct}% · ${item.reps}次 · ${nextDate}</span>
        </div>`;
      });
      retentionEl.innerHTML = html;
    }

    // Schedule
    const scheduleEl = document.getElementById('scheduleContent');
    const maxDue = Math.max(1, ...schedule.map(s => s.dueCount));

    if (schedule.every(s => s.dueCount === 0)) {
      scheduleEl.innerHTML = '<div class="empty-state"><span class="icon">📭</span>暂无复习日程</div>';
    } else {
      let html = '';
      schedule.forEach(s => {
        const d = new Date(s.date + 'T00:00:00');
        const isToday = s.date === new Date().toISOString().slice(0, 10);
        const isPast = d < new Date(new Date().toDateString());
        const barPct = Math.max(Math.round(s.dueCount / maxDue * 100), s.dueCount > 0 ? 6 : 0);
        const barColor = isPast ? 'rgba(244,63,94,0.5)' : isToday ? 'rgba(251,191,36,0.5)' : 'rgba(56,189,248,0.4)';
        const dayLabel = isToday ? '今天' : isPast ? '已过期' : s.date.slice(5);

        html += `<div class="memory-dist-row">
          <div class="memory-dist-label" style="${isToday ? 'color:var(--gold);font-weight:700;' : ''}">${dayLabel}</div>
          <div class="memory-dist-bar-wrap">
            <div class="memory-dist-bar" style="width:${barPct}%;background:${barColor};">${s.dueCount > 0 ? s.dueCount + ' 个待复习' : ''}</div>
          </div>
          <div class="memory-dist-count">${s.dueCount}</div>
        </div>`;
      });
      scheduleEl.innerHTML = html;
    }
  }

  // ── Toast ──
  function showToast(msg, type) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast ' + (type || 'success');
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ── 密钥管理 ──
  async function loadKeys() {
    try {
      const keys = await adminTracker.getKeys();
      _allKeys = keys || [];
      updateKeysStats(_allKeys);
      renderKeysTable(_allKeys);
      populateBatchFilter();
    } catch (e) {
      console.error('Failed to load keys:', e);
    }
  }

  function getKeyStatus(k) {
    const isRevoked = !k.is_active;
    const isUsed = k.used_by && !isRevoked;
    const isExpired = !isRevoked && !isUsed && k.expires_at && new Date(k.expires_at) < new Date();
    if (isRevoked) return { status: 'revoked', text: '已撤销' };
    if (isUsed) return { status: 'used', text: '已使用' };
    if (isExpired) return { status: 'expired', text: '已过期' };
    return { status: 'unused', text: '未使用' };
  }

  function updateKeysStats(keys) {
    const total = keys.length;
    let unused = 0, used = 0, revoked = 0, expired = 0;
    keys.forEach(k => {
      const s = getKeyStatus(k);
      if (s.status === 'unused') unused++;
      else if (s.status === 'used') used++;
      else if (s.status === 'revoked') revoked++;
      else if (s.status === 'expired') expired++;
    });
    const tEl = document.getElementById('key-total');
    const uEl = document.getElementById('key-unused');
    const usEl = document.getElementById('key-used');
    const rEl = document.getElementById('key-revoked');
    const eEl = document.getElementById('key-expired');
    if (tEl) tEl.textContent = total;
    if (uEl) uEl.textContent = unused;
    if (usEl) usEl.textContent = used;
    if (rEl) rEl.textContent = revoked;
    if (eEl) eEl.textContent = expired;
  }

  function renderKeysTable(keys) {
    const container = document.getElementById('keysTable');
    if (!container) return;
    if (keys.length === 0) {
      container.innerHTML = '<div class="empty-state"><span class="icon">📭</span>暂无密钥数据<br><small>生成密钥后将显示在此处</small></div>';
      return;
    }
    let html = `<table class="key-table">
      <thead><tr>
        <th>密钥</th><th>课程</th><th>班级</th><th>预设姓名</th>
        <th>状态</th><th>使用者</th><th>使用时间</th><th>过期时间</th><th>批次ID</th><th>操作</th>
      </tr></thead><tbody>`;
    keys.forEach(k => {
      const { status, text: statusText } = getKeyStatus(k);
      const safeKey = (k.key || '').replace(/'/g, "\\'");
      const usedAt = k.used_at ? new Date(k.used_at).toLocaleString('zh-CN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
      const expiresAt = k.expires_at ? new Date(k.expires_at).toLocaleString('zh-CN', { month:'short', day:'numeric' }) : '—';

      html += `<tr>
        <td style="color:var(--purple);font-family:monospace;font-size:14px;letter-spacing:1px;">${k.key || ''}</td>
        <td>${k.course_name || '—'}</td>
        <td>${k.class_name || '—'}</td>
        <td>${k.student_name || '—'}</td>
        <td><span class="key-badge ${status}">${statusText}</span></td>
        <td>${k.used_by || '—'}</td>
        <td style="font-size:11px;color:var(--text-dimmer);">${usedAt}</td>
        <td style="font-size:11px;color:var(--text-dimmer);">${expiresAt}</td>
        <td style="font-size:11px;font-family:monospace;color:var(--text-dimmer);">${k.batch_id || '—'}</td>
        <td>
          <button class="copy-btn" onclick="copyToClipboard('${safeKey}')">复制</button>
          ${status !== 'revoked' ? `<button class="revoke-btn" style="margin-left:6px;" onclick="handleRevokeKey('${safeKey}')">撤销</button>` : ''}
        </td>
      </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  async function handleBatchGenerateKeys() {
    const count = parseInt(document.getElementById('genCount').value) || 50;
    const courseName = document.getElementById('genCourseName').value.trim() || null;
    const className = document.getElementById('genClassName').value.trim() || null;
    const expiresAtInput = document.getElementById('genExpiresAt').value;
    const expiresAt = expiresAtInput ? new Date(expiresAtInput + 'T23:59:59').toISOString() : null;
    const batchId = 'batch_' + Date.now().toString(36);

    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    btn.textContent = '生成中...';
    try {
      const keys = await adminTracker.batchGenerateKeys(count, courseName, className, expiresAt);
      showToast(`成功生成 ${keys.length} 个密钥（批次：${batchId}）`, 'success');
      loadKeys();
    } catch (e) {
      showToast('生成失败：' + (e.message || e), 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '批量生成';
    }
  }

  async function handleRevokeKey(key) {
    if (!confirm(`确定撤销密钥 ${key} 吗？撤销后该密钥将无法使用。`)) return;
    try {
      const ok = await adminTracker.revokeKey(key);
      if (ok) { showToast('密钥已撤销', 'success'); loadKeys(); }
      else { showToast('撤销失败', 'error'); }
    } catch (e) {
      showToast('撤销失败：' + (e.message || e), 'error');
    }
  }

  function exportKeysToExcel() {
    if (_allKeys.length === 0) {
      showToast('暂无密钥数据可导出', 'error');
      return;
    }
    const data = _allKeys.map(k => ({
      '密钥': k.key,
      '课程': k.course_name || '',
      '班级': k.class_name || '',
      '预设姓名': k.student_name || '',
      '状态': getKeyStatus(k).text,
      '使用者': k.used_by || '',
      '使用时间': k.used_at || '',
      '过期时间': k.expires_at || '',
      '批次ID': k.batch_id || '',
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '密钥列表');
    XLSX.writeFile(wb, `密钥导出_${new Date().toISOString().slice(0,10)}.xlsx`);
    showToast('密钥已导出为Excel', 'success');
  }

  function copyToClipboard(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制到剪贴板', 'success');
      }).catch(() => { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('已复制到剪贴板', 'success');
    } catch (e) {
      showToast('复制失败', 'error');
    }
    document.body.removeChild(ta);
  }

  // ── Init ──
  initAdminTracker();
</script>

</body>
</html>
